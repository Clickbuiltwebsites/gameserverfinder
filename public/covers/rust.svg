<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Abstract riveted metal plates in rust and ember tones">
  <defs>
    <linearGradient id="rust-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221a14"/>
      <stop offset="1" stop-color="#14100d"/>
    </linearGradient>
    <linearGradient id="rust-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33281f"/>
      <stop offset="1" stop-color="#241c16"/>
    </linearGradient>
    <linearGradient id="rust-weld" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8763a" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#f0a259" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b8763a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#rust-base)"/>

  <!-- Plate wall -->
  <g stroke="#0f0c0a" stroke-width="4">
    <rect x="40" y="60" width="360" height="300" fill="url(#rust-plate)"/>
    <rect x="410" y="60" width="360" height="300" fill="#2b221a"/>
    <rect x="780" y="60" width="380" height="300" fill="url(#rust-plate)"/>
    <rect x="40" y="370" width="360" height="320" fill="#2b221a"/>
    <rect x="410" y="370" width="360" height="320" fill="url(#rust-plate)"/>
    <rect x="780" y="370" width="380" height="320" fill="#2b221a"/>
  </g>

  <!-- Rivets, on plate corners -->
  <g fill="#4a3b2d">
    <circle cx="70" cy="90" r="7"/><circle cx="370" cy="90" r="7"/>
    <circle cx="70" cy="330" r="7"/><circle cx="370" cy="330" r="7"/>
    <circle cx="440" cy="90" r="7"/><circle cx="740" cy="90" r="7"/>
    <circle cx="440" cy="330" r="7"/><circle cx="740" cy="330" r="7"/>
    <circle cx="810" cy="90" r="7"/><circle cx="1130" cy="90" r="7"/>
    <circle cx="810" cy="330" r="7"/><circle cx="1130" cy="330" r="7"/>
    <circle cx="70" cy="400" r="7"/><circle cx="370" cy="400" r="7"/>
    <circle cx="70" cy="660" r="7"/><circle cx="370" cy="660" r="7"/>
    <circle cx="440" cy="400" r="7"/><circle cx="740" cy="400" r="7"/>
    <circle cx="440" cy="660" r="7"/><circle cx="740" cy="660" r="7"/>
    <circle cx="810" cy="400" r="7"/><circle cx="1130" cy="400" r="7"/>
    <circle cx="810" cy="660" r="7"/><circle cx="1130" cy="660" r="7"/>
  </g>

  <!-- Corrosion patches -->
  <g fill="#7d4f26" opacity="0.28">
    <path d="M470 130 q60 -30 110 10 q40 40 -10 80 q-70 40 -110 -20 Z"/>
    <path d="M870 470 q80 -20 120 40 q20 60 -60 70 q-90 0 -80 -60 Z"/>
    <path d="M120 500 q50 -40 90 0 q30 50 -30 70 q-60 10 -60 -40 Z"/>
  </g>

  <!-- Glowing weld seams -->
  <path d="M40 360 H1160" stroke="url(#rust-weld)" stroke-width="5" fill="none"/>
  <path d="M410 60 V690" stroke="url(#rust-weld)" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M780 60 V690" stroke="url(#rust-weld)" stroke-width="3" fill="none" opacity="0.35"/>
</svg>
